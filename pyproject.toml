[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-ingest"
version = "0.2.0"
description = "Modular neuro-audio toolbox for ingest, storage, and visualization"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "numpy<2.0",
    "pandas>=2.0",
    "plotly>=5.0",
    "pyarrow>=12.0",
    "pydantic>=2.0",
    "streamlit>=1.38",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
